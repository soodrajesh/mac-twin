name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run test harness
        run: ./Tests/run_tests.sh

      - name: Build the app (ad-hoc signed, no notarization)
        run: ./build.sh
